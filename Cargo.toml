[package]
name = "xmouse-psnbridge"
version = "0.1.0"
edition = "2021"
description = "PlayStation Remote Play plugin for XMouse"
license = "AGPL-3.0-only"
repository = "https://github.com/thedarkcr0w/xmouse-psnbridge"
readme = "README.md"

[dependencies]
# The Remote Play protocol itself (discovery, registration, session, stream transport) comes
# from chiaki-rust, a Rust port of chiaki-ng's library (AGPL-3.0-only). Pinned to one commit so
# a build is reproducible and so the README can say exactly which upstream code is inside.
# Only the protocol crate is used; the upstream UI, decoder and audio crates are not built.
chiaki-core = { git = "https://github.com/muentzee/chiaki-rust", rev = "7b95e825389ace25307d20c9c89e2d5fc906c474" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The account ID is handed around as base64 (the form the upstream tools print).
base64 = "0.22"
# chiaki-core reports what it is doing through `tracing`; the subscriber prints that to stderr,
# which XMouse copies into its own log.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The protocol code does a lot of crypto and error correction per packet: keep it fast in
# debug builds too, or a debug build can't keep up with a 60 fps stream.
[profile.dev.package."*"]
opt-level = 2
